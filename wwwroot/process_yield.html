<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>国轩5厂数字化看板(测试版)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: "Microsoft YaHei";
            /*background: #f5f7fa;*/
            background-color: #0b1c2d;
            color: #ffffff;
        }

        h2 {
            text-align: center;
        }

        #chart {
            width: 100%;
            height: 420px;
            background: #122b45;
            border-radius: 8px;
        }
    </style>
</head>



<body>

    <h2 id="pageTitle" style="margin-left:30px; color:#fff;">铁锂电池生产产量</h2>


    <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:15px;
    ">

        <!-- 左侧：产线 -->
        <div>
            <label style="color:#fff;">产线：</label>
            <select id="lineSelect" style="padding:6px 10px;">
                <option value="">-- 请选择 --</option>
            </select>
        </div>

        <!-- 右侧：时间 -->
        <div>
            <label style="color:#fff;">开始时间：</label>
            <input id="startTime"
                   type="datetime-local"
                   step="60"
                   style="padding:6px 10px;" />

            <label style="color:#fff; margin-left:10px;">结束时间：</label>
            <input id="endTime"
                   type="datetime-local"
                   step="60"
                   style="padding:6px 10px;" />
        </div>

        <div style="display:flex;align-items:center;gap:15px;">
            <label style="color:#fff;">
                <input type="checkbox" id="chkPlan" checked>
                计划
            </label>
            <label style="color:#fff;">
                <input type="checkbox" id="chkActual" checked>
                实际
            </label>
            <label style="color:#fff;">
                <input type="checkbox" id="chkYield" checked>
                良品率
            </label>
        </div>

    </div>

    <table id="dataTable" 
           style="width:100%;
                  border-collapse:collapse;
                  margin-bottom:15px;
                  background:#122b45;
                  color:#fff;
                  text-align:center;
">
        <thead>
            <tr id="headerRow" style="background:#1e3c5a;">
                
            </tr>
        </thead>
        <tbody>
            <tr id="planRow"></tr>               
            <tr id="actualRow"></tr>
        </tbody>
    </table>

    <div id="chart"/>

    <script>
        const chart = echarts.init(document.getElementById('chart'));
        const select = document.getElementById('lineSelect');

        const legendSelected = {
            '计划': true,
            '实际': true,
            '良品率': true
        };

        fetch(location.origin + '/api/production/lines')
            .then(res => res.json())
            .then(res => {
                res.data.forEach(line => {

                    lineMap[line.tenantID] = line.name;

                    const opt = document.createElement('option');
                    opt.value = line.tenantID;
                    opt.textContent = line.name;
                    select.appendChild(opt);
                });
            });

        fetch(location.origin + '/api/production/yield')
            .then(res => res.json())
            .then(res => {
                const data = res.data;

                const option = {
                    tooltip: { trigger: 'axis' },
                    xAxis: {
                        type: 'category',
                        data: data.map(d => d.process)
                    },
                    yAxis: {
                        type: 'value',
                        name: '产量'
                    },
                    series: [{
                        name: '产量',
                        type: 'bar',
                        data: data.map(d => d.yield),
                        label: { show: true, position: 'top' }
                    }]
                };

                chart.setOption(option);
            });

        window.addEventListener('resize', () => chart.resize());

        let lineMap = {};

        function loadChart(tenantID) {
            let url = location.origin + '/api/production/yield';
            if (tenantID) {
                url += `?tenantID=${tenantID}`;
            }

            fetch(url)
                .then(res => res.json())
                .then(res => {
                    const data = res.data;

                    const headerRow = document.getElementById('headerRow');                  
                    const planRow = document.getElementById('planRow');
                    const actualRow = document.getElementById('actualRow');

                    headerRow.innerHTML = '';                  
                    planRow.innerHTML = '';
                    actualRow.innerHTML = '';

                    
                    data.forEach(d => {
                        const th = document.createElement('th');
                        th.textContent = d.process;
                        th.style.cssText =
                            'padding:8px;border:1px solid #2c4a6b;';
                        headerRow.appendChild(th);
                    });

                    
                    data.forEach(d => {
                        

                        // 计划
                        const tdPlan = document.createElement('td');
                        tdPlan.textContent = d.plan;
                        tdPlan.style.cssText = 'padding:6px;border:1px solid #2c4a6b;color:#ffd966;';
                        planRow.appendChild(tdPlan);

                        // 实际
                        const tdActual = document.createElement('td');
                        tdActual.textContent = d.actual;
                        tdActual.style.cssText = 'padding:6px;border:1px solid #2c4a6b;color:#5a9cff;';
                        actualRow.appendChild(tdActual);
                    });

                   

                    const option = {
                        backgroundColor: '#122b45',
                        tooltip: { trigger: 'axis' },

                        legend: {
                            data: ['计划', '实际', '良品率'],
                            top: 10,
                            right: 20,
                            textStyle: {
                                color: '#fff',
                                fontSize: 14
                            },
                            itemWidth: 20,
                            itemHeight: 12
                        },

                        xAxis: {
                            type: 'category',
                            data: data.map(d => d.process),
                            axisLabel: {
                                color: '#fff',
                                interval: 0,
                                formatter: val => val.split('').join('\n')
                            }
                        },

                        // ✅ 左侧：产量
                        yAxis: [{
                            type: 'value',
                            name: '产量',
                            max:2000,
                            axisLabel: { color: '#fff' }
                        },
                        // ✅ 右侧：良品率（%）
                        {
                            type: 'value',
                            name: '良品率（%）',
                            min: 0,
                            max: 100,
                            axisLabel: {
                                color: '#52c41a',
                                formatter: '{value}%'
                            },
                            splitLine: { show: false }
                        }],

                        series: [
                            // ✅ 计划（浅黄）
                            {
                                name: '计划',
                                type: 'bar',
                                data: data.map(d => d.plan),
                                barWidth: '35%',
                                itemStyle: {
                                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                        { offset: 0, color: '#ffd966' },
                                        { offset: 1, color: '#b38f00' }
                                    ]),
                                    borderColor: '#8a6d00',
                                    borderWidth: 1,
                                    borderRadius: [4, 4, 0, 0],
                                    shadowColor: 'rgba(0,0,0,0.3)',
                                    shadowOffsetY: 4
                                },

                                z: 1
                            },
                            // ✅ 实际（工业蓝）
                            {
                                name: '实际',
                                type: 'bar',
                                data: data.map(d => d.actual),
                                barWidth: '35%',
                                itemStyle: {
                                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                        { offset: 0, color: '#5a9cff' },
                                        { offset: 1, color: '#1f4fa3' }
                                    ]),
                                    borderColor: '#3b7dd8',
                                    borderWidth: 1,
                                    borderRadius: [4, 4, 0, 0],
                                    shadowColor: 'rgba(0,0,0,0.3)',
                                    shadowOffsetY: 4
                                },
                                label: {
                                    show: true,
                                    position: 'top',
                                    fontWeight: 'bold',
                                    formatter: function (params) {
                                        const idx = params.dataIndex;
                                        const plan = data[idx].plan;
                                        const actual = data[idx].actual;

                                        if (actual < plan) {
                                            return `{red|${actual}}`;
                                        }
                                        if (actual > plan) {
                                            return `{green|${actual}}`;
                                        }
                                        return `{white|${actual}}`;
                                    },
                                    rich: {
                                        red: {
                                            color: '#ff4d4f',
                                            fontWeight: 'bold'
                                        },
                                        green: {
                                            color: '#52c41a',
                                            fontWeight: 'bold'
                                        },
                                        white: {
                                            color: '#fff',
                                            fontWeight: 'bold'
                                        }
                                    }
                                },
                                z: 2
                            },
                            // ✅ 良品率折线（上方）
                            {
                                name: '良品率',
                                type: 'line',
                                data: data.map(d => d.yieldRate * 100),
                                yAxisIndex: 1,
                                smooth: true,
                                symbol: 'circle',
                                symbolSize: 8,
                                lineStyle: { color: '#52c41a', width: 3 },
                                itemStyle: { color: '#52c41a' },
                                label: {
                                    show: true,
                                    formatter: '{c}%',
                                    color: '#52c41a'
                                }
                            }
                        ]

                    };

                    chart.setOption(option, false);
                })
                .catch(err => {
                    console.error(err);
                    alert('加载产量失败');
                });
        }

        function updateLegend() {
            legendSelected['计划'] = document.getElementById('chkPlan').checked;
            legendSelected['实际'] = document.getElementById('chkActual').checked;
            legendSelected['良品率'] = document.getElementById('chkYield').checked;

            chart.setOption({
                legend: {
                    selected: legendSelected
                }
            }, false);
        }

        document.getElementById('chkPlan').addEventListener('change', updateLegend);
        document.getElementById('chkActual').addEventListener('change', updateLegend);
        document.getElementById('chkYield').addEventListener('change', updateLegend);

        

        select.addEventListener('change', () => {

            const title = document.getElementById('pageTitle');
            const name = lineMap[select.value];

            title.textContent = name
                ? `${name} - 各工序产量统计`
                : '各工序产量统计';

            loadChart(select.value);
        });

        window.onload = () => {
            if (select.options.length > 1) {
                select.selectedIndex = 1;
                select.dispatchEvent(new Event('change'));
            }
        };
    </script>

</body>
</html>
